<head>
<meta charset="utf-8">

<style>
/* ── Tokens ──────────────────────────────────────────────────────────────── */
:root {
  --bg:          #0F1117;
  --surface:     #1A1D27;
  --surface-2:   #222534;
  --border:      #2A2D42;
  --text-1:      #E4E6F0;
  --text-2:      #8B8FA8;
  --text-3:      #4E5270;
  --accent:      #5B6EF5;
  --accent-bg:   rgba(91,110,245,.12);
  --mono:        ui-monospace,"Cascadia Code","Fira Code","Consolas",monospace;
  --sans:        -apple-system,"Segoe UI",system-ui,sans-serif;
  --radius:      6px;
  --sidebar-w:   220px;
  --header-h:    52px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:        #F2F3F7;
    --surface:   #FFFFFF;
    --surface-2: #F2F3F7;
    --border:    #DDE0EC;
    --text-1:    #1A1D2E;
    --text-2:    #5A5E78;
    --text-3:    #9599B3;
  }
}
:root[data-theme="light"] {
  --bg:        #F2F3F7;
  --surface:   #FFFFFF;
  --surface-2: #F2F3F7;
  --border:    #DDE0EC;
  --text-1:    #1A1D2E;
  --text-2:    #5A5E78;
  --text-3:    #9599B3;
}
:root[data-theme="dark"] {
  --bg:        #0F1117;
  --surface:   #1A1D27;
  --surface-2: #222534;
  --border:    #2A2D42;
  --text-1:    #E4E6F0;
  --text-2:    #8B8FA8;
  --text-3:    #4E5270;
}

/* ── Reset ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: inherit; text-decoration: none; }

/* ── Header ──────────────────────────────────────────────────────────────── */
header {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: .04em;
  white-space: nowrap;
}
.stat-pill {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 99px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.search-wrap {
  flex: 1;
  max-width: 360px;
  margin-left: auto;
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}
#search {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 13px;
  padding: 6px 10px 6px 32px;
  outline: none;
  transition: border-color .15s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text-3); }
.theme-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-2);
  cursor: pointer;
  padding: 5px 8px;
  font-size: 13px;
  line-height: 1;
  transition: border-color .15s, color .15s;
}
.theme-btn:hover { border-color: var(--accent); color: var(--text-1); }

/* ── Body layout ─────────────────────────────────────────────────────────── */
.layout {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
aside {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0 32px;
}
.sidebar-section { margin-bottom: 24px; }
.sidebar-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0 16px;
  margin-bottom: 6px;
  display: block;
}
.folder-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5px 16px;
  background: none;
  border: none;
  color: var(--text-2);
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: background .12s, color .12s;
  border-radius: 0;
}
.folder-btn:hover { background: var(--surface-2); color: var(--text-1); }
.folder-btn.active { background: var(--accent-bg); color: var(--text-1); }
.folder-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.folder-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 12px;
}
.tag-chip {
  font-size: 11px;
  font-family: var(--mono);
  padding: 2px 7px;
  border-radius: 99px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  white-space: nowrap;
}
.tag-chip:hover { border-color: var(--accent); color: var(--text-1); }
.tag-chip.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

/* ── Type filters ────────────────────────────────────────────────────────── */
.type-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 12px;
}
.type-chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  white-space: nowrap;
}
.type-chip:hover { border-color: var(--accent); color: var(--text-1); }
.type-chip.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

/* ── Main feed ───────────────────────────────────────────────────────────── */
main {
  flex: 1;
  overflow-y: auto;
  padding: 20px 28px 40px;
}
.empty-state {
  color: var(--text-3);
  font-family: var(--mono);
  font-size: 13px;
  padding: 60px 0;
  text-align: center;
}
.month-group { margin-bottom: 32px; }
.month-header {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-3);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
  font-variant-numeric: tabular-nums;
}
.note-row {
  display: grid;
  grid-template-columns: 88px 1fr auto;
  gap: 0 12px;
  align-items: center;
  padding: 7px 10px;
  border-radius: var(--radius);
  transition: background .1s;
  cursor: default;
}
.note-row:hover { background: var(--surface-2); }
.note-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.note-title {
  font-size: 13px;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.note-updated {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent);
  margin-left: 6px;
}
.note-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.badge {
  font-size: 10px;
  font-family: var(--mono);
  padding: 1px 6px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: .85;
}
.badge-folder {
  border: 1px solid;
}
.badge-type {
  background: var(--surface-2);
  color: var(--text-2);
  border: 1px solid var(--border);
}

/* ── Timeline bar ────────────────────────────────────────────────────────── */
.timeline-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 7px 20px;
  display: flex;
  align-items: center;
  gap: 5px;
  overflow-x: auto;
  flex-shrink: 0;
}
.timeline-bar::-webkit-scrollbar { height: 3px; }
.tl-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
  padding-right: 8px;
  border-right: 1px solid var(--border);
  margin-right: 4px;
}
.month-pill {
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  cursor: pointer;
  white-space: nowrap;
  transition: border-color .12s, color .12s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.month-pill:hover { border-color: var(--accent); color: var(--text-1); }
.month-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.mpill-count { color: var(--text-3); font-size: 10px; }

/* ── Scrollbar ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
</style>
</head>

const FOLDER_META = {"10-Work": {"label": "Work & Projects", "color": "#5B6EF5"}, "20-Learning": {"label": "Learning", "color": "#34C88A"}, "20-Learning/CCA-F": {"label": "CCA-F", "color": "#38BDF8"}, "20-Learning/Certifications": {"label": "Certifications", "color": "#A78BFA"}, "20-Learning/Cognitive-PM-AI": {"label": "Cognitive PM AI", "color": "#F472B6"}, "40-Reference": {"label": "Reference", "color": "#FBBF24"}, "50-Archive": {"label": "Archive", "color": "#6B7280"}, "Journal": {"label": "Journal", "color": "#F87171"}};

let activeFolder = null;
let activeTag    = null;
let activeType   = null;
let searchQuery  = '';

// ── Theme ──────────────────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const cur  = root.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', next);
}

// ── Filtering ──────────────────────────────────────────────────────────────
function filtered() {
  return DATA.notes.filter(n => {
    if (activeFolder && !n.folder.startsWith(activeFolder)) return false;
    if (activeTag    && !n.tags.includes(activeTag))         return false;
    if (activeType   && n.type !== activeType)               return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!n.title.toLowerCase().includes(q) &&
          !n.tags.join(' ').toLowerCase().includes(q) &&
          !n.folder.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function buildSidebar() {
  const nav = document.getElementById('folder-nav');
  const total = DATA.notes.length;

  const allBtn = makeFolder('all', 'Todos', total, null);
  nav.appendChild(allBtn);

  Object.entries(DATA.stats.by_folder)
    .sort((a,b) => b[1] - a[1])
    .forEach(([key, count]) => {
      nav.appendChild(makeFolder(key, FOLDER_META[key]?.label || key, count, FOLDER_META[key]?.color));
    });
}

function makeFolder(key, label, count, color) {
  const btn = document.createElement('button');
  btn.className = 'folder-btn' + (key === 'all' && !activeFolder ? ' active' : '');
  btn.dataset.key = key;

  const dot = document.createElement('span');
  dot.className = 'folder-dot';
  dot.style.background = color || 'var(--text-3)';
  if (key === 'all') dot.style.background = 'var(--accent)';

  const lbl = document.createElement('span');
  lbl.textContent = label;
  lbl.style.overflow = 'hidden';
  lbl.style.textOverflow = 'ellipsis';
  lbl.style.whiteSpace = 'nowrap';

  const cnt = document.createElement('span');
  cnt.className = 'folder-count';
  cnt.textContent = count;

  btn.append(dot, lbl, cnt);
  btn.onclick = () => {
    activeFolder = key === 'all' ? null : key;
    activeTag = null;
    activeType = null;
    document.getElementById('search').value = '';
    searchQuery = '';
    refreshAll();
  };
  return btn;
}

function buildTagCloud() {
  const freq = {};
  DATA.notes.forEach(n => n.tags.forEach(t => { freq[t] = (freq[t]||0)+1; }));
  const top = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, 40);
  const cloud = document.getElementById('tag-cloud');
  cloud.innerHTML = '';
  top.forEach(([tag]) => {
    const chip = document.createElement('button');
    chip.className = 'tag-chip' + (activeTag === tag ? ' active' : '');
    chip.textContent = '#' + tag;
    chip.onclick = () => {
      activeTag = activeTag === tag ? null : tag;
      refreshAll();
    };
    cloud.appendChild(chip);
  });
}

function buildTypeFilters() {
  const types = [...new Set(DATA.notes.map(n => n.type).filter(Boolean))].sort();
  const wrap = document.getElementById('type-filters');
  wrap.innerHTML = '';
  types.forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'type-chip' + (activeType === t ? ' active' : '');
    chip.textContent = t;
    chip.onclick = () => {
      activeType = activeType === t ? null : t;
      refreshAll();
    };
    wrap.appendChild(chip);
  });
}

// ── Feed ───────────────────────────────────────────────────────────────────
function buildFeed(notes) {
  const feed = document.getElementById('main-feed');
  feed.innerHTML = '';

  if (!notes.length) {
    feed.innerHTML = '<p class="empty-state">Sin resultados.</p>';
    return;
  }

  const byMonth = {};
  notes.forEach(n => {
    const d     = new Date(n.date + 'T12:00:00');
    const key   = n.date.slice(0,7);
    const label = d.toLocaleString('es', {month:'long', year:'numeric'});
    if (!byMonth[key]) byMonth[key] = { label, notes: [] };
    byMonth[key].notes.push(n);
  });

  Object.entries(byMonth)
    .sort((a,b) => b[0].localeCompare(a[0]))
    .forEach(([key, { label, notes: mnotes }]) => {
      const group = document.createElement('div');
      group.className = 'month-group';
      group.id = 'month-' + key;

      const hdr = document.createElement('div');
      hdr.className = 'month-header';
      hdr.textContent = key + ' — ' + label.charAt(0).toUpperCase() + label.slice(1);
      group.appendChild(hdr);

      mnotes.forEach(n => {
        const row = document.createElement('div');
        row.className = 'note-row';

        const dateEl = document.createElement('span');
        dateEl.className = 'note-date';
        dateEl.textContent = n.date;

        const titleWrap = document.createElement('span');
        titleWrap.className = 'note-title';
        titleWrap.textContent = n.title;
        if (n.updated) {
          const upd = document.createElement('span');
          upd.className = 'note-updated';
          upd.textContent = '↑' + n.updated;
          titleWrap.appendChild(upd);
        }

        const meta = document.createElement('span');
        meta.className = 'note-meta';

        const fm = FOLDER_META[n.folder];
        if (fm) {
          const fb = document.createElement('span');
          fb.className = 'badge badge-folder';
          fb.textContent = fm.label;
          fb.style.color       = fm.color;
          fb.style.borderColor = fm.color + '55';
          fb.style.background  = fm.color + '18';
          meta.appendChild(fb);
        }

        if (n.type) {
          const tb = document.createElement('span');
          tb.className = 'badge badge-type';
          tb.textContent = n.type;
          meta.appendChild(tb);
        }

        row.append(dateEl, titleWrap, meta);
        group.appendChild(row);
      });

      feed.appendChild(group);
    });
}

// ── Timeline bar ──────────────────────────────────────────────────────────
function buildTimeline() {
  const bar = document.getElementById('timeline-bar');
  bar.innerHTML = '<span class="tl-label">Índice</span>';

  const byMonth = {};
  DATA.notes.forEach(n => {
    const key = n.date.slice(0,7);
    if (!byMonth[key]) {
      const d = new Date(n.date + 'T12:00:00');
      byMonth[key] = { label: d.toLocaleString('es', {month:'short', year:'2-digit'}), count: 0 };
    }
    byMonth[key].count++;
  });

  Object.entries(byMonth).sort((a,b) => b[0].localeCompare(a[0])).forEach(([key, {label, count}]) => {
    const pill = document.createElement('button');
    pill.className = 'month-pill';
    pill.dataset.month = key;
    pill.innerHTML = '<span>' + label + '</span><span class="mpill-count">' + count + '</span>';
    pill.onclick = () => {
      document.querySelectorAll('.month-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      const anchor = document.getElementById('month-' + key);
      if (anchor) anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    bar.appendChild(pill);
  });
}

// ── Stats pill ─────────────────────────────────────────────────────────────
function updateStats(notes) {
  document.getElementById('total-pill').textContent = notes.length + ' notas';
  document.getElementById('date-pill').textContent  = 'actualizado ' + DATA.stats.last_updated;
}

// ── Active states ──────────────────────────────────────────────────────────
function updateActiveFolder() {
  document.querySelectorAll('.folder-btn').forEach(btn => {
    const key = btn.dataset.key;
    btn.classList.toggle('active',
      (!activeFolder && key === 'all') || activeFolder === key);
  });
}

// ── Refresh ────────────────────────────────────────────────────────────────
function refreshAll() {
  const notes = filtered();
  buildFeed(notes);
  updateStats(notes);
  buildTagCloud();
  buildTypeFilters();
  updateActiveFolder();
}

// ── Search ─────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  refreshAll();
});

// ── Init ───────────────────────────────────────────────────────────────────
buildSidebar();
buildTimeline();
refreshAll();
</script>
</body>
</html>
